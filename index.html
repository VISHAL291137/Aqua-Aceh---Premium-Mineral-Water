      body {

        background-color: #ffffff;

      /* 3D Perspective Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }

        to { opacity: 1; }
      }
      #root {
        animation: fadeIn 0.8s ease-out;
      }
